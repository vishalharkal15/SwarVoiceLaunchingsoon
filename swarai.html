<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Browser Tab Title -->
  <title>SwarVoice — Launching Soon</title>

  <!-- SwarVoice Browser Tab Logo / Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050505'/%3E%3Cpath d='M43 19c-3-3-7-5-12-5-8 0-13 4-13 10 0 5 3 8 12 11 7 2 10 4 10 7 0 3-3 5-8 5-6 0-10-2-14-6l-4 8c5 5 11 7 18 7 10 0 16-5 16-13 0-6-4-10-13-13-7-2-9-4-9-6 0-2 2-3 5-3 4 0 7 1 10 4z' fill='white'/%3E%3C/svg%3E"
  />

  <style>
    /* =========================================
       RESET
    ========================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --text: #f5f5f5;
      --muted: #858585;
      --soft: #676767;
      --border: rgba(255, 255, 255, 0.09);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* =========================================
       PAGE
    ========================================== */

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      isolation: isolate;
      overflow: hidden;
    }

    /* =========================================
       BACKGROUND
    ========================================== */

    .background {
      position: absolute;
      inset: 0;

      z-index: -1;

      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.035),
          transparent 48%
        );
    }

    /* =========================================
       MOVING GRID
    ========================================== */

    .grid {
      position: absolute;

      inset: -10%;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      mask-image:
        radial-gradient(
          ellipse at center,
          black 12%,
          transparent 78%
        );

      -webkit-mask-image:
        radial-gradient(
          ellipse at center,
          black 12%,
          transparent 78%
        );

      animation: gridMove 28s linear infinite;
    }

    @keyframes gridMove {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(70px, 70px, 0);
      }
    }

    /* =========================================
       BACKGROUND GLOWS
    ========================================== */

    .glow {
      position: absolute;

      width: 520px;
      height: 520px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.07);

      filter: blur(130px);

      opacity: 0.45;

      animation: glowFloat 15s ease-in-out infinite;
    }

    .glow-one {
      top: -300px;
      left: 4%;
    }

    .glow-two {
      right: -300px;
      bottom: -300px;

      animation-delay: -7s;
    }

    @keyframes glowFloat {
      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(80px, 40px, 0) scale(1.08);
      }
    }

    /* =========================================
       FLOATING GLASS BOXES
    ========================================== */

    .floating-boxes {
      position: absolute;
      inset: 0;

      overflow: hidden;
    }

    .box {
      position: absolute;

      border: 1px solid rgba(255, 255, 255, 0.075);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.008)
        );

      box-shadow:
        inset 0 0 30px rgba(255, 255, 255, 0.01),
        0 0 35px rgba(255, 255, 255, 0.012);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      transform-style: preserve-3d;

      animation:
        boxFloat 17s ease-in-out infinite,
        boxRotate 22s linear infinite;
    }

    .box::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          135deg,
          transparent 25%,
          rgba(255, 255, 255, 0.035),
          transparent 75%
        );

      opacity: 0.4;
    }

    /* Box 1 */
    .box-1 {
      width: 110px;
      height: 110px;

      top: 12%;
      left: 8%;

      animation-duration: 18s, 27s;
    }

    /* Box 2 */
    .box-2 {
      width: 55px;
      height: 55px;

      top: 20%;
      right: 18%;

      animation-duration: 13s, 20s;

      animation-delay: -4s, -2s;
    }

    /* Box 3 */
    .box-3 {
      width: 150px;
      height: 150px;

      bottom: 6%;
      left: 13%;

      animation-duration: 20s, 30s;

      animation-delay: -8s, -10s;
    }

    /* Box 4 */
    .box-4 {
      width: 75px;
      height: 75px;

      top: 55%;
      right: 8%;

      animation-duration: 15s, 24s;

      animation-delay: -5s, -7s;
    }

    /* Box 5 */
    .box-5 {
      width: 42px;
      height: 42px;

      top: 38%;
      left: 25%;

      animation-duration: 11s, 19s;

      animation-delay: -3s, -5s;
    }

    /* Box 6 */
    .box-6 {
      width: 125px;
      height: 125px;

      bottom: 18%;
      right: 25%;

      animation-duration: 22s, 34s;

      animation-delay: -10s, -4s;
    }

    /* Box 7 */
    .box-7 {
      width: 35px;
      height: 35px;

      top: 72%;
      left: 48%;

      animation-duration: 10s, 18s;

      animation-delay: -6s, -3s;
    }

    /* Floating movement */
    @keyframes boxFloat {
      0%,
      100% {
        margin-top: 0;
        margin-left: 0;
        opacity: 0.14;
      }

      25% {
        margin-top: -35px;
        margin-left: 20px;
        opacity: 0.26;
      }

      50% {
        margin-top: 15px;
        margin-left: -25px;
        opacity: 0.11;
      }

      75% {
        margin-top: -20px;
        margin-left: 35px;
        opacity: 0.22;
      }
    }

    /* 3D rotation */
    @keyframes boxRotate {
      0% {
        transform:
          rotateX(0deg)
          rotateY(0deg)
          rotateZ(0deg);
      }

      50% {
        transform:
          rotateX(20deg)
          rotateY(25deg)
          rotateZ(10deg);
      }

      100% {
        transform:
          rotateX(0deg)
          rotateY(0deg)
          rotateZ(0deg);
      }
    }

    /* =========================================
       SMALL PARTICLES
    ========================================== */

    .particle {
      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.35);

      box-shadow:
        0 0 14px rgba(255, 255, 255, 0.35);

      animation: particleFloat 9s ease-in-out infinite;
    }

    .p1 {
      top: 22%;
      left: 33%;
    }

    .p2 {
      top: 68%;
      left: 62%;

      animation-delay: -3s;
    }

    .p3 {
      top: 42%;
      right: 30%;

      animation-delay: -5s;
    }

    .p4 {
      bottom: 22%;
      right: 12%;

      animation-delay: -7s;
    }

    @keyframes particleFloat {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
        opacity: 0.2;
      }

      50% {
        transform: translate3d(0, -28px, 0);
        opacity: 0.8;
      }
    }

    /* =========================================
       HEADER
    ========================================== */

    .header {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 28px 24px;

      position: relative;
      z-index: 5;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;

      letter-spacing: -0.9px;

      animation: fadeUp 0.8s ease both;
    }

    /* =========================================
       MAIN
    ========================================== */

    .main {
      flex: 1;

      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px 70px;

      position: relative;
      z-index: 5;
    }

    .hero {
      width: 100%;
      max-width: 950px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* =========================================
       LAUNCHING SOON
    ========================================== */

    .launching {
      font-size: clamp(
        18px,
        3vw,
        28px
      );

      line-height: 1;

      font-weight: 600;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: #a0a0a0;

      animation:
        fadeUp 0.8s ease 0.12s both;
    }

    .launching::after {
      content: "";

      display: block;

      width: 44px;
      height: 1px;

      margin: 16px auto 0;

      background: rgba(255, 255, 255, 0.22);

      animation:
        lineGrow 1s ease 0.55s both;
    }

    @keyframes lineGrow {
      from {
        width: 0;
        opacity: 0;
      }

      to {
        width: 44px;
        opacity: 1;
      }
    }

    /* =========================================
       HERO TITLE
    ========================================== */

    .hero-title {
      margin-top: 36px;

      max-width: 1000px;

      font-size: clamp(
        52px,
        9vw,
        104px
      );

      line-height: 0.94;

      font-weight: 700;

      letter-spacing: clamp(
        -4px,
        -0.65vw,
        -7px
      );

      animation:
        titleEnter
        1s
        cubic-bezier(0.16, 1, 0.3, 1)
        0.28s
        both;
    }

    .hero-title span {
      color: #676767;
    }

    @keyframes titleEnter {
      from {
        opacity: 0;

        transform:
          translateY(30px)
          scale(0.97);

        filter: blur(8px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter: blur(0);
      }
    }

    /* =========================================
       DESCRIPTION
    ========================================== */

    .description {
      width: 100%;
      max-width: 610px;

      margin-top: 28px;

      color: var(--muted);

      font-size: clamp(
        15px,
        2vw,
        18px
      );

      line-height: 1.65;

      animation:
        fadeUp 0.9s ease 0.48s both;
    }

    /* =========================================
       FEATURES
    ========================================== */

    .features {
      display: flex;
      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: 12px 24px;

      margin-top: 40px;

      color: #505050;

      font-size: 12px;

      animation:
        fadeUp 0.9s ease 0.64s both;
    }

    .feature {
      position: relative;
    }

    .feature:not(:last-child)::after {
      content: "";

      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #414141;

      right: -14px;
      top: 50%;

      transform: translateY(-50%);
    }

    /* =========================================
       FOOTER
    ========================================== */

    footer {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 20px 16px 26px;

      color: #3f3f3f;

      font-size: 11px;

      position: relative;
      z-index: 5;

      animation:
        fadeUp 0.8s ease 0.8s both;
    }

    /* =========================================
       GENERAL ANIMATION
    ========================================== */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       TABLET
    ========================================== */

    @media (max-width: 768px) {

      .header {
        padding: 24px 20px;
      }

      .main {
        padding: 30px 20px 60px;
      }

      .box-1 {
        left: -30px;
      }

      .box-3 {
        left: -40px;
      }

      .box-6 {
        right: -45px;
      }
    }

    /* =========================================
       MOBILE
    ========================================== */

    @media (max-width: 600px) {

      body {
        overflow-y: auto;
      }

      .page {
        min-height: 100svh;
      }

      .header {
        padding: 20px 16px;
      }

      .logo {
        font-size: 19px;
      }

      .main {
        padding: 30px 16px 50px;
      }

      .launching {
        font-size: 15px;
        letter-spacing: 0.15em;
      }

      .launching::after {
        margin-top: 12px;
      }

      .hero-title {
        margin-top: 28px;

        font-size: clamp(
          42px,
          13vw,
          62px
        );

        line-height: 0.98;

        letter-spacing: -3px;
      }

      .description {
        margin-top: 22px;

        font-size: 14px;

        line-height: 1.55;
      }

      .features {
        margin-top: 28px;

        gap: 8px 18px;

        font-size: 11px;
      }

      .feature:not(:last-child)::after {
        right: -11px;
      }

      /* Smaller animated boxes */

      .box-1 {
        width: 70px;
        height: 70px;

        left: -30px;
      }

      .box-2 {
        width: 42px;
        height: 42px;

        right: 4%;
      }

      .box-3 {
        width: 90px;
        height: 90px;

        left: -35px;
      }

      .box-4 {
        width: 55px;
        height: 55px;

        right: -10px;
      }

      .box-5 {
        width: 30px;
        height: 30px;
      }

      .box-6 {
        width: 80px;
        height: 80px;

        right: -35px;
      }

      .box-7 {
        width: 25px;
        height: 25px;
      }

      .grid {
        background-size: 55px 55px;
      }

      .glow {
        width: 320px;
        height: 320px;

        filter: blur(100px);
      }

      footer {
        padding: 16px;
      }
    }

    /* =========================================
       SMALL MOBILE
    ========================================== */

    @media (max-width: 380px) {

      .hero-title {
        font-size: 40px;
        letter-spacing: -2.5px;
      }

      .description {
        font-size: 13px;
      }

      .features {
        flex-direction: column;
        gap: 7px;
      }

      .feature::after {
        display: none !important;
      }

      .glow {
        width: 260px;
        height: 260px;
      }
    }

    /* =========================================
       REDUCED MOTION
    ========================================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background">

      <!-- Moving Grid -->
      <div class="grid"></div>

      <!-- Glow -->
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>

      <!-- Floating Glass Boxes -->
      <div class="floating-boxes">

        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
        <div class="box box-4"></div>
        <div class="box box-5"></div>
        <div class="box box-6"></div>
        <div class="box box-7"></div>

      </div>

      <!-- Floating Particles -->
      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>

    </div>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

      <div class="logo">
        SwarVoice
      </div>

    </header>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="main">

      <section class="hero">

        <!-- Launching -->
        <div class="launching">
          Launching Soon
        </div>

        <!-- Main Heading -->
        <h1 class="hero-title">
          Your Business,<br />
          <span>Now Speaking.</span>
        </h1>

        <!-- Description -->
        <p class="description">
          Intelligent AI voice agents that understand customers,
          speak naturally, and handle real business conversations.
        </p>

        <!-- Features -->
        <div class="features">

          <span class="feature">
            Natural Conversations
          </span>

          <span class="feature">
            Business AI
          </span>

          <span class="feature">
            Human Handoff
          </span>

        </div>

      </section>

    </main>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer>
      © 2026 SwarVoice
    </footer>

  </div>

</body>
</html>
